server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  # The browser talks only to its own origin. Nginx removes the /api prefix
  # before forwarding to the Compose backend service, so this works from a
  # remote host as well as localhost.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    # Keep the browser's port (for example :8080) so FastAPI's url_for()
    # returns same-origin dataset-image URLs.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Search responses use FastAPI's local dataset-image URLs. Keep those
  # same-origin as well rather than exposing an internal Compose hostname.
  location /dataset-images/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
