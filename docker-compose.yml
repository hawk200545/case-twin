# -------------------------------------------------------
# CaseTwin — local deployment
#
#   docker compose up --build
#
#   Backend API  → http://localhost:8005
#   Frontend UI  → http://localhost:8080
#
# Backend secrets come from backend/.env (gitignored) via
# env_file — they are never baked into the image.
# The frontend bakes VITE_API_URL from .env.production at
# build time; it points at http://localhost:8005 which is
# where the backend is published below.
# -------------------------------------------------------

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATASET_DIR: /app/dataset
    volumes:
      - ./dataset:/app/dataset:ro
    depends_on:
      - qdrant
    ports:
      - "8005:8000"
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  qdrant_storage:
